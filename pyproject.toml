[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edo"
version = "0.2.0"
description = "Solución numérica de ecuaciones diferenciales: método de Euler y métodos intercambiables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "notebook>=7"]

[tool.setuptools.packages.find]
include = ["edo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
